# Netlify build + hosting config (set "Base directory" to hash-frontend/frontend in Netlify).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL in Netlify -> Site settings -> Environment variables
  # e.g. https://hash-api.onrender.com/api

# OPTION A (recommended): proxy the API through Netlify so cookies are first-party
# (works in Safari/iOS, which blocks third-party cookies). Uncomment, put in your
# Render URL, and leave VITE_API_URL unset.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API.onrender.com/api/:splat"
#   status = 200
#   force = true

# React Router: serve index.html for every path so refreshing /events etc. works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the frontend
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # CSP blocks inline <script> (XSS) and limits where data can be sent.
    # connect-src allows your Render API; change *.onrender.com if you use another host.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Long-term caching for fingerprinted build files, images and video.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
